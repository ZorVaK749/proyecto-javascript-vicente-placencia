<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Portafolio VP</title>
</head>
<body class="transition-colors duration-300 bg-white text-black">

<!-- Navbar -->
<nav class="bg-blue-600 p-4 text-white flex items-center">
  <a href="index.html" class="mr-4">Inicio</a>
  <a href="proyectos.html" class="mr-4">Proyectos</a>
  <a href="contacto.html">Contacto</a>
  <button onclick="toggleModoOscuro()" class="ml-auto bg-gray-200 text-black px-3 py-1 rounded">
    ☀️/🌙
  </button>
</nav>

<main class="container mx-auto p-4 min-h-screen">

  <!-- Sección Hero -->
  <section class="text-center py-12">
    <h1 class="text-4xl md:text-5xl font-bold text-blue-600 mb-4">
      Hola, soy <span class="underline">Vicente Placencia</span>
    </h1>
    <p class="text-xl text-gray-700 mb-8">Desarrollador Frontend apasionado por JavaScript y Tailwind CSS.</p>
    <button onclick="location.href='contacto.html'" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition">¡Contáctame!</button>
  </section>

  <!-- Sección Habilidades -->
  <section class="my-12">
    <h2 class="text-2xl font-bold mb-6 text-center">Mis Habilidades</h2>
    <div id="habilidades" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
      <div class="p-4 rounded-lg bg-gray-100 text-black">
        <p class="font-semibold">HTML</p>
      </div>
      <div class="p-4 rounded-lg bg-gray-100 text-black">
        <p class="font-semibold">CSS</p>
      </div>
      <div class="p-4 rounded-lg bg-gray-100 text-black">
        <p class="font-semibold">JavaScript</p>
      </div>
      <div class="p-4 rounded-lg bg-gray-100 text-black">
        <p class="font-semibold">Tailwind</p>
      </div>
    </div>
  </section>

  <!-- CTA Proyectos -->
  <section id="cta" class="text-center bg-blue-50 p-8 rounded-lg my-12 text-black">
    <h3 class="text-xl font-bold mb-4">¿Quieres ver mis proyectos?</h3>
    <button onclick="location.href='proyectos.html'" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition">Explorar Proyectos</button>
  </section>
</main>

<!-- Contador de visitas -->
<p class="text-center mb-4">Visitas: <span id="contador-visitas">0</span></p>

<!-- Footer -->
<footer class="bg-gray-800 p-4 text-white text-center">
  © 2025 Mi Portafolio<br />
  ZoRuRex INC.
</footer>

<script>
  // Contador de visitas
  if (window.location.pathname.includes("index.html")) {
    let visitas = localStorage.getItem("visitas") || 0;
    visitas++;
    localStorage.setItem("visitas", visitas);
    document.getElementById("contador-visitas").textContent = visitas;
  }

  // Modo oscuro
  function toggleModoOscuro() {
    document.body.classList.toggle("bg-gray-900");
    document.body.classList.toggle("text-white");

    const isDark = document.body.classList.contains("bg-gray-900");
    localStorage.setItem("modoOscuro", isDark);

    // Cambiar fondo y texto de las tarjetas manualmente
    const tarjetas = document.querySelectorAll("#habilidades > div");
    tarjetas.forEach(t => {
      t.classList.toggle("bg-gray-100", !isDark);
      t.classList.toggle("bg-gray-700", isDark);
      t.classList.toggle("text-black", !isDark);
      t.classList.toggle("text-white", isDark);
    });
    
    const cta = document.getElementById("cta");
    if (isDark) {
      cta.classList.remove("bg-blue-50", "text-black");
      cta.classList.add("bg-gray-800", "text-white");
    } else {
      cta.classList.remove("bg-gray-800", "text-white");
      cta.classList.add("bg-blue-50", "text-black");
    }
  }

  // Aplicar modo guardado
  if (localStorage.getItem("modoOscuro") === "true") {
    toggleModoOscuro(); // activa el modo al cargar
  }

</script>

</body>
</html>
