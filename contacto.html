<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Document</title>
</head>
<body class="transition-colors duration-300 bg-white text-black">

<!-- Navbar -->
<nav class="bg-blue-600 p-4 text-white flex items-center">
  <a href="index.html" class="mr-4">Inicio</a>
  <a href="proyectos.html" class="mr-4">Proyectos</a>
  <a href="contacto.html">Contacto</a>
  <button onclick="toggleModoOscuro()" class="ml-auto bg-gray-200 text-black px-3 py-1 rounded">
    ☀️/🌙
  </button>
</nav>
<main class="container mx-auto p-4 min-h-screen">
  <section id="formulario-container" class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6 md:p-8 mt-8">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">Contáctame</h1>

    <!-- Formulario -->
    <form id="form-contacto" class="space-y-4">
      <!-- Campo Nombre -->
      <div>
        <label for="nombre" class="block text-gray-700 mb-1">Nombre:</label>
        <input
          type="text"
          id="nombre"
          placeholder="Tu nombre"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        >
        <p id="error-nombre" class="text-red-500 text-sm mt-1 hidden">Mínimo 3 caracteres</p>
      </div>

      <!-- Campo Email -->
      <div>
        <label for="email" class="block text-gray-700 mb-1">Email:</label>
        <input
          type="email"
          id="email"
          placeholder="tucorreo@ejemplo.com"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        >
        <p id="error-email" class="text-red-500 text-sm mt-1 hidden">Email no válido</p>
      </div>

      <!-- Campo Mensaje -->
      <div>
        <label for="mensaje" class="block text-gray-700 mb-1">Mensaje:</label>
        <textarea
          id="mensaje"
          rows="4"
          placeholder="¿En qué puedo ayudarte?"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        ></textarea>
        <p id="error-mensaje" class="text-red-500 text-sm mt-1 hidden">Mínimo 10 caracteres</p>
      </div>

      <!-- Botón Enviar -->
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg transition font-semibold"
      >
        Enviar Mensaje
      </button>

      <!-- Mensaje de éxito -->
      <div id="mensaje-exito" class="hidden p-4 bg-green-100 text-green-700 rounded-lg text-center">
        ¡Mensaje enviado con éxito!
      </div>
    </form>
  </section>
</main>

<!-- Footer -->
<footer class="bg-gray-800 p-4 text-white text-center">
  © 2025 Mi Portafolio<br/>
  ZoRuRex INC.
</footer>

<!-- Scripts -->
<script>
    document.getElementById("form-contacto")?.addEventListener("submit", function(e) {
    e.preventDefault();
    let isValid = true;

    // Validar nombre (mínimo 3 caracteres)
    const nombre = document.getElementById("nombre");
    const errorNombre = document.getElementById("error-nombre");
    if (nombre.value.length < 3) {
        errorNombre.classList.remove("hidden");
        isValid = false;
    } else {
        errorNombre.classList.add("hidden");
    }

    // Validar email (formato básico)
    const email = document.getElementById("email");
    const errorEmail = document.getElementById("error-email");
    if (!email.value.includes("@") || !email.value.includes(".")) {
        errorEmail.classList.remove("hidden");
        isValid = false;
    } else {
        errorEmail.classList.add("hidden");
    }

    // Validar mensaje (mínimo 10 caracteres)
    const mensaje = document.getElementById("mensaje");
    const errorMensaje = document.getElementById("error-mensaje");
    if (mensaje.value.length < 10) {
        errorMensaje.classList.remove("hidden");
        isValid = false;
    } else {
        errorMensaje.classList.add("hidden");
    }

    // Si todo es válido, mostrar mensaje de éxito
    if (isValid) {
        document.getElementById("mensaje-exito").classList.remove("hidden");
        this.reset(); // Limpiar formulario
        setTimeout(() => {
            document.getElementById("mensaje-exito").classList.add("hidden");
        }, 3000); // Ocultar mensaje después de 3 segundos
    }
});
  function toggleModoOscuro() {
    document.body.classList.toggle("bg-gray-900");
    document.body.classList.toggle("text-white");

    const isDark = document.body.classList.contains("bg-gray-900");
    localStorage.setItem("modoOscuro", isDark);

    // Cambiar fondo del formulario
    const container = document.getElementById("formulario-container");
    container.classList.toggle("bg-white", !isDark);
    container.classList.toggle("bg-gray-800", isDark);

    // Labels
    document.querySelectorAll("label").forEach(label => {
      label.classList.toggle("text-gray-700", !isDark);
      label.classList.toggle("text-gray-200", isDark);
    });

    // Inputs y textareas
    document.querySelectorAll("input, textarea").forEach(el => {
      el.classList.toggle("bg-white", !isDark);
      el.classList.toggle("bg-gray-700", isDark);
      el.classList.toggle("text-black", !isDark);
      el.classList.toggle("text-white", isDark);
      el.classList.toggle("border-gray-300", !isDark);
      el.classList.toggle("border-gray-600", isDark);
    });

    // Mensaje de éxito
    const success = document.getElementById("mensaje-exito");
    success.classList.toggle("bg-green-100", !isDark);
    success.classList.toggle("text-green-700", !isDark);
    success.classList.toggle("bg-green-900", isDark);
    success.classList.toggle("text-green-200", isDark);
  }

  // Aplicar modo guardado
  if (localStorage.getItem("modoOscuro") === "true") {
    toggleModoOscuro();
  }
</script>

</body>
</html>
